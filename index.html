<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>비둘기 출근 시뮬레이터 (Pigeon Commute)</title>
<style>
  body {
    margin: 0;
    background: #1a1a1a;
    color: #fff;
    font-family: 'Malgun Gothic', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  canvas {
    background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 75%, #7f8c8d 75%, #95a5a6 100%);
    border: 4px solid #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .controls {
    margin-top: 15px;
    text-align: center;
    font-size: 16px;
    background: #2c3e50;
    padding: 12px 25px;
    border-radius: 8px;
  }
  kbd {
    background: #ecf0f1;
    color: #2c3e50;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: bold;
    box-shadow: 0 2px 0 #bdc3c7;
  }
</style>
</head>
<body>

<canvas id="game" width="800" height="450"></canvas>

<div class="controls">
  <kbd>Q</kbd> 왼발 &nbsp;|&nbsp; <kbd>W</kbd> 오른발 (번갈아 누르세요!) &nbsp;|&nbsp; <kbd>Space</kbd> 날개 퍼덕임 (균형 회복 / 새우깡 회피) &nbsp;|&nbsp; <kbd>R</kbd> 재시작
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GROUND_Y = 338;
const GOAL_DIST = 100; // 100m 목표

let pigeon, obstacles, state, message, subMessage;

function init() {
  pigeon = {
    x: 150,
    y: GROUND_Y - 45,
    vx: 0,
    vy: 0,
    angle: 0,         // 기울기 (라디안)
    angVel: 0,        // 각속도
    lastFoot: null,   // 'L' or 'R'
    leftLegAngle: 0,
    rightLegAngle: 0,
    wingFlap: 0,
    stamina: 100,
    distance: 0,
    onGround: true
  };

  // 길바닥 방해물 (새우깡, 껌 등)
  obstacles = [];
  for (let i = 15; i < GOAL_DIST; i += Math.floor(Math.random() * 12) + 10) {
    obstacles.push({
      dist: i,
      type: Math.random() > 0.3 ? 'shrimp' : 'gum',
      passed: false
    });
  }

  state = 'PLAY'; // PLAY, GAMEOVER, WIN
  message = '';
  subMessage = '';
}

window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'r') {
    init();
    return;
  }
  if (state !== 'PLAY') return;

  if (key === 'q') step('L');
  if (key === 'w') step('R');
  if (e.code === 'Space') {
    e.preventDefault();
    flap();
  }
});

function step(foot) {
  if (!pigeon.onGround) {
    // 공중에서 발버둥치면 균형만 무너짐
    pigeon.angVel += (foot === 'L' ? -0.05 : 0.05);
    return;
  }

  if (pigeon.lastFoot === foot) {
    // 같은 발 연속 입력 -> 다리 꼬임!
    pigeon.angVel += 0.14;
    pigeon.vy = -3;
    pigeon.onGround = false;
    showToast("발 꼬임! 번갈아 누르세요!");
  } else {
    // 정상 걸음 (하지만 약간 불안정함)
    pigeon.lastFoot = foot;
    pigeon.vx = 3.2;
    pigeon.vy = -2.2;
    pigeon.onGround = false;
    
    // 걸을 때마다 앞뒤로 기우뚱거림
    pigeon.angVel += (foot === 'L' ? 0.035 : -0.025);
    
    if (foot === 'L') {
      pigeon.leftLegAngle = -0.6;
      pigeon.rightLegAngle = 0.5;
    } else {
      pigeon.leftLegAngle = 0.5;
      pigeon.rightLegAngle = -0.6;
    }
  }
}

function flap() {
  if (pigeon.stamina < 20) {
    showToast("날개 쥐남! (스태미나 부족)");
    return;
  }
  pigeon.stamina -= 22;
  pigeon.vy = -5.5;
  pigeon.vx += 1.2;
  pigeon.onGround = false;
  pigeon.wingFlap = 15;
  // 날갯짓은 기울어진 몸을 어느 정도 수평으로 복원시켜줌
  pigeon.angVel *= 0.2;
  pigeon.angle *= 0.5;
}

let toastTimer = 0;
let toastText = "";
function showToast(txt) {
  toastText = txt;
  toastTimer = 60;
}

function update() {
  if (state !== 'PLAY') return;

  // 스태미나 회복
  if (pigeon.stamina < 100) pigeon.stamina += 0.35;
  if (pigeon.wingFlap > 0) pigeon.wingFlap--;
  if (toastTimer > 0) toastTimer--;

  // 중력 및 이동
  pigeon.vy += 0.28; // 중력
  pigeon.y += pigeon.vy;
  pigeon.distance += pigeon.vx * 0.05;
  pigeon.vx *= 0.94; // 마찰/공기저항

  // 다리 각도 서서히 복귀
  pigeon.leftLegAngle *= 0.9;
  pigeon.rightLegAngle *= 0.9;

  // 바닥 충돌
  if (pigeon.y >= GROUND_Y - 45) {
    pigeon.y = GROUND_Y - 45;
    pigeon.vy = 0;
    pigeon.onGround = true;
  }

  // 불안정한 물리 균형 (가만히 있어도 미세하게 기움)
  if (pigeon.onGround) {
    pigeon.angVel += Math.sin(pigeon.angle) * 0.008;
    // 미세한 떨림
    pigeon.angVel += (Math.random() - 0.5) * 0.004;
  }
  pigeon.angle += pigeon.angVel;
  pigeon.angVel *= 0.95;

  // 넘어짐 판정 (약 65도 이상 기울면 부리 박음)
  if (Math.abs(pigeon.angle) > 1.15) {
    gameOver(
      pigeon.angle > 0 ? "부리부터 아스팔트에 꽂혔습니다." : "뒤로 발라당 뒤집혔습니다.",
      "사유: 지각 및 품위 유지 위반 (권고사직)"
    );
  }

  // 장애물(새우깡/껌) 충돌 판정
  obstacles.forEach(obs => {
    const relX = (obs.dist - pigeon.distance) * 35;
    if (Math.abs(relX) < 18 && pigeon.y > GROUND_Y - 62) {
      if (obs.type === 'shrimp') {
        gameOver(
          "바닥에 떨어진 새우깡의 유혹을 못 이겼습니다!",
          "출근 대신 과자 부스러기를 쪼아먹으며 인생을 탕진했습니다."
        );
      } else {
        gameOver(
          "누가 뱉은 껌을 밟아 발이 붙었습니다!",
          "119 구조대가 올 때까지 출근하지 못했습니다."
        );
      }
    }
  });

  // 목표 도달
  if (pigeon.distance >= GOAL_DIST) {
    state = 'WIN';
    message = "🎉 강남역 출근 성공! 🎉";
    subMessage = "하지만 오늘 일요일입니다.";
  }
}

function gameOver(msg, sub) {
  state = 'GAMEOVER';
  message = msg;
  subMessage = sub;
}

function drawPigeon() {
  ctx.save();
  ctx.translate(pigeon.x, pigeon.y);
  ctx.rotate(pigeon.angle);

  // 다리 (왼쪽/오른쪽)
  ctx.strokeStyle = '#e74c3c';
  ctx.lineWidth = 4;
  
  // 왼다리
  ctx.save();
  ctx.translate(-5, 15);
  ctx.rotate(pigeon.leftLegAngle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 28);
  ctx.lineTo(10, 28);
  ctx.stroke();
  ctx.restore();

  // 오른다리
  ctx.save();
  ctx.translate(5, 15);
  ctx.rotate(pigeon.rightLegAngle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 28);
  ctx.lineTo(10, 28);
  ctx.stroke();
  ctx.restore();

  // 몸통 (통통한 비둘기)
  ctx.fillStyle = '#7f8c8d';
  ctx.beginPath();
  ctx.ellipse(0, 5, 28, 20, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#2c3e50';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 꼬리 깃털
  ctx.fillStyle = '#34495e';
  ctx.beginPath();
  ctx.moveTo(-22, 8);
  ctx.lineTo(-42, 18);
  ctx.lineTo(-35, 2);
  ctx.closePath();
  ctx.fill();

  // 목 & 머리
  ctx.fillStyle = '#95a5a6';
  ctx.beginPath();
  ctx.arc(20, -15, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 비둘기 특유의 초록/보라 목 털
  ctx.fillStyle = '#1abc9c';
  ctx.fillRect(10, -8, 16, 6);

  // 부리
  ctx.fillStyle = '#f39c12';
  ctx.beginPath();
  ctx.moveTo(32, -17);
  ctx.lineTo(44, -13);
  ctx.lineTo(32, -10);
  ctx.closePath();
  ctx.fill();

  // 멍청한 눈 (기울어질수록 동공이 커짐)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(24, -17, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  const pupilSize = Math.abs(pigeon.angle) > 0.6 ? 3.5 : 2;
  ctx.beginPath();
  ctx.arc(25, -17, pupilSize, 0, Math.PI * 2);
  ctx.fill();

  // 날개 (퍼덕임 연출)
  ctx.fillStyle = '#bdc3c7';
  ctx.beginPath();
  if (pigeon.wingFlap > 0) {
    ctx.ellipse(-2, -15, 18, 10, -0.8, 0, Math.PI * 2);
  } else {
    ctx.ellipse(-2, 4, 18, 9, 0.2, 0, Math.PI * 2);
  }
  ctx.fill();
  ctx.stroke();

  // 출근용 넥타이 (디테일)
  ctx.fillStyle = '#c0392b';
  ctx.beginPath();
  ctx.moveTo(22, -2);
  ctx.lineTo(28, 14);
  ctx.lineTo(20, 18);
  ctx.lineTo(18, 12);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawWorld() {
  // 배경 거리 표시선 (보도블록 틈새)
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  const offset = (pigeon.distance * 35) % 80;
  for (let x = -offset; x < canvas.width; x += 80) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(x - 20, canvas.height);
    ctx.stroke();
  }

  // 거리 표지판 (10m 단위)
  ctx.fillStyle = '#2c3e50';
  ctx.font = 'bold 14px sans-serif';
  for (let m = 0; m <= GOAL_DIST; m += 10) {
    const screenX = pigeon.x + (m - pigeon.distance) * 35;
    if (screenX > -50 && screenX < canvas.width + 50) {
      ctx.fillRect(screenX, GROUND_Y - 30, 4, 30);
      ctx.fillStyle = '#fff';
      ctx.fillRect(screenX - 18, GROUND_Y - 50, 40, 22);
      ctx.strokeRect(screenX - 18, GROUND_Y - 50, 40, 22);
      ctx.fillStyle = '#000';
      ctx.fillText(m + 'm', screenX - 12, GROUND_Y - 34);
    }
  }

  // 장애물 그리기
  obstacles.forEach(obs => {
    const screenX = pigeon.x + (obs.dist - pigeon.distance) * 35;
    if (screenX > -30 && screenX < canvas.width + 30) {
      if (obs.type === 'shrimp') {
        // 새우깡
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(screenX, GROUND_Y - 6, 8, 0.2, Math.PI * 1.4);
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#e67e22';
        ctx.stroke();
        ctx.fillStyle = '#d35400';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText("새우깡!", screenX - 18, GROUND_Y - 18);
      } else {
        // 껌
        ctx.fillStyle = '#ff9ff3';
        ctx.beginPath();
        ctx.ellipse(screenX, GROUND_Y - 2, 12, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c0392b';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText("껌", screenX - 6, GROUND_Y - 12);
      }
    }
  });

  // 결승선 (강남역 2번 출구)
  const goalX = pigeon.x + (GOAL_DIST - pigeon.distance) * 35;
  if (goalX < canvas.width + 100) {
    ctx.fillStyle = '#27ae60';
    ctx.fillRect(goalX, GROUND_Y - 120, 80, 120);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText("강남역", goalX + 18, GROUND_Y - 90);
    ctx.fillText("2번출구", goalX + 15, GROUND_Y - 70);
  }
}

function drawUI() {
  // 상단 HUD
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(15, 15, 250, 75);
  
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText(`남은 거리: ${Math.max(0, (GOAL_DIST - pigeon.distance)).toFixed(1)}m`, 25, 42);

  // 날개 스태미나 바
  ctx.font = '13px sans-serif';
  ctx.fillText('날개 근력:', 25, 68);
  ctx.fillStyle = '#555';
  ctx.fillRect(90, 56, 150, 14);
  ctx.fillStyle = pigeon.stamina > 25 ? '#2ecc71' : '#e74c3c';
  ctx.fillRect(90, 56, (pigeon.stamina / 100) * 150, 14);

  // 경고 토스트 메시지
  if (toastTimer > 0) {
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(toastText, canvas.width / 2, 120);
    ctx.textAlign = 'left';
  }

  // 게임 오버 / 클리어 화면
  if (state !== 'PLAY') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = state === 'WIN' ? '#2ecc71' : '#e74c3c';
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText(message, canvas.width / 2, 190);

    ctx.fillStyle = '#ecf0f1';
    ctx.font = '18px sans-serif';
    ctx.fillText(subMessage, canvas.width / 2, 235);

    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText("[ R 키를 눌러 다시 출근하기 ]", canvas.width / 2, 300);
    ctx.textAlign = 'left';
  }
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawWorld();
  drawPigeon();
  drawUI();
  update();
  requestAnimationFrame(loop);
}

init();
loop();
</script>
</body>
</html>
